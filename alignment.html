<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Advanced notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color: blue;
                color: antiquewhite;
                text-align: center;
                margin: 0 auto;
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 1fr;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 25px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: flex-end;
                align-items: center;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <h1>Alignment</h1>
        <div id="grid-wrapper">
            <div id="box" onmouseover="showHide()">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div><div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <button onclick="changeColor">Click Me</button>
        <script>
            function changeColor(){
                let currentColor = document.getElementById("newColor").value
                document.getElementById("box").style.backgroundColor ="orange"
            }
            function showHide(){
                let item = document.getElementById("Flex-wrapper").style.display
                if(item.style.display == "flex"){
                    item.style.display == "none"
                    document.getElementById("text").
                    innerHTML = "Show More"
                }else{
                    item.style.display = "flex"
                    document.getElementById("text").
                    innerHTML = "Show More"
                }
            }
        </script>
       </body>
